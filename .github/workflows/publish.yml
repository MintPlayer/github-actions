name: Publish

on:
  push:
    branches:
      - main

permissions:
  contents: write

# Queue rather than cancel: two pushes in quick succession would otherwise run two
# publishers that both commit, both push, and both force-move the major tag. Cancelling
# one mid-push is worse than making it wait.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4
      with:
        # Full history and tags, so publish.sh can tell an existing release tag from a new
        # one. It re-fetches tags itself rather than trusting this, but starting from a
        # complete clone keeps the push a fast-forward.
        fetch-depth: 0
        fetch-tags: true

    - uses: ./compile-ts-action
      with:
        working-directory: .
        output-dir: dist
        node-version: 24.x
        install-command: npm ci
        test-command: npm test
        build-command: npm run all
        mode: push
        commit-message: 'Pack with dependencies to dist'
